name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: OAuth and MCP security smoke tests
        run: |
          export APP_LOGIN_PASSWORD="$(openssl rand -hex 24)"
          export AUTH_SIGNING_SECRET="$(openssl rand -hex 48)"
          export EXECUTION_APPROVAL_SECRET="$(openssl rand -hex 32)"
          pnpm smoke
      - run: pnpm audit --prod
      - run: pnpm release:check
      - run: pnpm exec wrangler deploy --dry-run
